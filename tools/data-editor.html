<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTD 데이터 에디터</title>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0a1a;--panel:#111120;--border:#2a2a4e;--accent:#FF6600;
  --save:#44cc44;--reset:#cc4444;--text:#e0e0e0;--dim:#888;
  --input-bg:#0a0a18;--input-border:#333;--row-h:32px;
}
html,body{height:100%;overflow:hidden;}
body{font-family:'Oxanium',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;}

/* ─── Header ─── */
.header{background:var(--panel);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:16px;flex-shrink:0;}
.header h1{font-size:18px;font-weight:700;color:var(--accent);}
.header .ver{font-size:11px;color:var(--dim);}

/* ─── Tabs ─── */
.tab-bar{display:flex;background:var(--panel);border-bottom:2px solid var(--border);flex-shrink:0;overflow-x:auto;}
.tab-btn{padding:10px 22px;font-family:inherit;font-size:13px;font-weight:600;background:transparent;color:var(--dim);border:none;cursor:pointer;border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap;}
.tab-btn:hover{color:var(--text);background:rgba(255,102,0,.05);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);background:rgba(255,102,0,.08);}

/* ─── Content ─── */
.tab-content{flex:1;overflow:hidden;display:none;flex-direction:column;}
.tab-content.active{display:flex;}
.scroll-area{flex:1;overflow:auto;padding:16px 20px 20px;}

/* ─── Sections ─── */
.section{margin-bottom:24px;}
.section-title{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);}

/* ─── Form Row ─── */
.form-row{display:flex;align-items:center;gap:12px;margin-bottom:8px;min-height:var(--row-h);}
.form-row label{width:160px;font-size:12px;color:var(--dim);flex-shrink:0;}
.form-row input,.form-row select{font-family:inherit;font-size:12px;background:var(--input-bg);color:var(--text);border:1px solid var(--input-border);border-radius:4px;padding:5px 8px;width:160px;}
.form-row input:focus,.form-row select:focus{outline:none;border-color:var(--accent);}
.form-row .unit{font-size:11px;color:var(--dim);margin-left:4px;}
.form-row .pct{font-size:11px;color:#aaa;min-width:50px;text-align:right;}
.sum-row{padding:6px 0;font-size:13px;font-weight:600;}
.sum-row.ok{color:var(--save);}
.sum-row.err{color:var(--reset);}

/* ─── Tables ─── */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:6px;}
table{width:100%;border-collapse:collapse;min-width:700px;}
thead{position:sticky;top:0;z-index:2;}
th{background:#1a1a30;color:var(--accent);font-size:11px;font-weight:600;padding:6px 8px;text-align:left;border-bottom:2px solid var(--border);white-space:nowrap;}
td{padding:3px 6px;border-bottom:1px solid rgba(42,42,78,.4);height:var(--row-h);vertical-align:middle;}
td input,td select{font-family:inherit;font-size:11px;background:var(--input-bg);color:var(--text);border:1px solid var(--input-border);border-radius:3px;padding:3px 6px;width:100%;}
td input:focus,td select:focus{outline:none;border-color:var(--accent);}
td input[readonly]{color:var(--dim);background:transparent;border-color:transparent;cursor:default;}
td .calc{color:var(--dim);font-style:italic;font-size:11px;}
tr.boss-row{background:rgba(255,50,50,.1);border-left:3px solid #ff3232;}
tr.boss-row td:first-child{padding-left:10px;}
tr.duration-row{background:rgba(0,200,80,.07);border-left:3px solid #00cc50;}
input.dim-cell, input:disabled.dim-cell{opacity:0.25;background:transparent;cursor:not-allowed;}
input:disabled{opacity:0.35;cursor:not-allowed;}

/* tier row colors */
tr.tier-normal{background:rgba(136,136,136,.06);}
tr.tier-rare{background:rgba(34,139,34,.06);}
tr.tier-ancient{background:rgba(153,0,204,.06);}
tr.tier-relic{background:rgba(255,127,0,.06);}
tr.tier-saga{background:rgba(192,192,192,.06);}
tr.tier-legend{background:rgba(255,224,0,.06);}
tr.tier-epic{background:rgba(64,224,208,.06);}
tr.tier-myth{background:rgba(255,51,0,.06);}
tr.tier-primordial{background:rgba(0,255,255,.06);}

/* ─── Bottom Bar ─── */
.bottom-bar{flex-shrink:0;background:var(--panel);border-top:2px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.bottom-bar button{font-family:inherit;font-size:12px;font-weight:600;padding:8px 18px;border:none;border-radius:5px;cursor:pointer;transition:filter .15s;}
.bottom-bar button:hover{filter:brightness(1.2);}
.btn-save{background:var(--save);color:#000;}
.btn-reset{background:var(--reset);color:#fff;}
.btn-copy{background:#3366cc;color:#fff;}
.btn-paste{background:#8844aa;color:#fff;}
.status-msg{font-size:12px;margin-left:auto;transition:opacity .3s;}
.status-msg.ok{color:var(--save);}
.status-msg.err{color:var(--reset);}

/* type affinity table */
.affinity-tbl{width:auto;min-width:auto;}
.affinity-tbl td,.affinity-tbl th{padding:6px 14px;text-align:center;}
</style>
</head>
<body>

<div class="header">
  <h1>🛠️ RTD 데이터 에디터</h1>
  <span class="ver">v3.0 — 통합 에디터</span>
</div>

<div class="tab-bar" id="tabBar"></div>

<!-- Tab 1: System Rules -->
<div class="tab-content" id="tab-system">
  <div class="scroll-area" id="systemArea"></div>
</div>

<!-- Tab 2: Tower Stats -->
<div class="tab-content" id="tab-tower">
  <div class="scroll-area" id="towerArea"></div>
</div>

<!-- Tab 3: Projectile/Skills -->
<div class="tab-content" id="tab-skill">
  <div class="scroll-area" id="skillArea"></div>
</div>

<!-- Tab: Monster -->
<div class="tab-content" id="tab-monster">
  <div class="scroll-area" id="monsterArea"></div>
</div>

<!-- Tab 4: Stages -->
<div class="tab-content" id="tab-stage">
  <div class="scroll-area" id="stageArea"></div>
</div>

<!-- Tab 5: DPS MODE -->
<div class="tab-content" id="tab-dps">
  <div class="scroll-area" id="dpsArea"></div>
</div>

<div class="bottom-bar">
  <button class="btn-save" onclick="saveCurrentTab()">💾 저장</button>
  <button class="btn-reset" onclick="resetCurrentTab()">↩ 기본값</button>
  <button class="btn-reset" onclick="resetAllTabs()" style="background:#c0392b;" title="모든 탭의 localStorage를 삭제하고 최신 DEFAULT 데이터로 새로 로드합니다">🗑 전체 초기화</button>
  <button class="btn-copy" onclick="copyJSON()">📋 JSON 복사</button>
  <button class="btn-paste" onclick="pasteJSON()">📥 JSON 붙여넣기</button>
  <button class="btn-apply" onclick="applyToCode()" style="background:#00bcd4;color:#000;font-weight:bold;">🚀 파일에 영구 적용</button>
  <span class="status-msg" id="statusMsg"></span>
</div>

// HELPERS
// ═══════════════════════════════════════════════
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function showStatus(msg, ok){
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg ' + (ok ? 'ok' : 'err');
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.textContent=''; }, 3000);
}
function loadLS(key, fallback){
  try{
    const v = localStorage.getItem(key);
    if (!v) return deepClone(fallback);
    const saved = JSON.parse(v);

    // 배열: 항목 수 비교 — localStorage < DEFAULT 이면 구버전으로 판단 → DEFAULT 사용
    if (Array.isArray(fallback) && Array.isArray(saved) && saved.length < fallback.length) {
      console.warn('[loadLS] 구버전 감지! ' + key + ': localStorage(' + saved.length + '개) < DEFAULT(' + fallback.length + '개) → DEFAULT로 자동 전환');
      localStorage.removeItem(key);
      return deepClone(fallback);
    }

    // 플레인 객체: DEFAULT를 베이스로 저장값으로 덮어쓰기 (신규 키가 localStorage에 없어도 DEFAULT 값으로 자동 채움)
    if (!Array.isArray(fallback) && fallback !== null && typeof fallback === 'object') {
      const merged = deepClone(fallback);
      Object.keys(saved).forEach(k => { merged[k] = saved[k]; });
      return merged;
    }

    return saved;
  }
  catch(e){ console.error('[loadLS] 오류:', key, e); return deepClone(fallback); }
}

// TAB MANAGEMENT
// ═══════════════════════════════════════════════
function initTabs(){
  const bar = document.getElementById('tabBar');
  TABS.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (t.id === activeTab ? ' active' : '');
    btn.textContent = t.label;
    btn.dataset.tab = t.id;
    btn.onclick = () => switchTab(t.id);
    bar.appendChild(btn);
  });
}

function switchTab(id){
  activeTab = id;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-'+id));
}

    normal:    { boss_normal: 1.00, boss_large: 1.00, boss_small: 1.00 },
    explosive: { boss_normal: 0.75, boss_large: 1.00, boss_small: 0.50 },
    vibration: { boss_normal: 0.50, boss_large: 0.25, boss_small: 1.00 }
  };
  ['normal','explosive','vibration'].forEach(at => {
    const b = BOSS_EFF[at];
    html += `<tr>
      <td style="font-weight:600">${ATK_LABELS[at]}</td>
      <td style="color:${b.boss_small>1?'#f66':b.boss_small<1?'#6af':'#fff'}">${b.boss_small}×</td>
      <td style="color:${b.boss_large>1?'#f66':b.boss_large<1?'#6af':'#fff'}">${b.boss_large}×</td>
      <td style="color:${b.boss_normal>1?'#f66':b.boss_normal<1?'#6af':'#fff'}">${b.boss_normal}×</td>
    </tr>`;
  });
  html += '</tbody></table></div>';
  html += '<div style="padding:6px 8px;font-size:11px;color:#aaa">🔴 빨간색=취약(>1×) / 🔵 파란색=저항(&lt;1×) / 일반 몬스터 상성과 동일한 수치 적용 — 수정은 js/config.js BOSS_EFFECTIVENESS에서</div></div>';


  area.innerHTML = html;

  // Rate change listeners
  area.querySelectorAll('[data-rate]').forEach(inp => {
    inp.addEventListener('input', updateGachaSum);
  });
  area.querySelectorAll('[data-synthesis-rate]').forEach(inp => {
    inp.addEventListener('input', updateSynthesisRateSum);
  });
  updateGachaSum();
  updateSynthesisRateSum();
}

function updateGachaSum(){
  const rateInputs = Array.from(document.querySelectorAll('[data-rate]'));
  const sum = rateInputs.reduce((total, inp) => total + (parseFloat(inp.value) || 0), 0);
  const displayTotal = sum || 100000;

  rateInputs.forEach(inp => {
    const v = parseFloat(inp.value) || 0;
    const pctEl = document.getElementById('pct-' + inp.dataset.rate);
    if(pctEl) pctEl.textContent = (v/displayTotal*100).toFixed(4) + '%';
  });
  const sumEl = document.getElementById('rateSum');
  const _sumTotal = 100000;
  const pct = (sum / _sumTotal * 100).toFixed(4);
  const ok = sum >= 99000 && sum <= 101000;
  sumEl.textContent = `합계: ${pct}% (${sum}/${_sumTotal})`;
  sumEl.className = 'sum-row ' + (ok ? 'ok' : 'err');
  if(!ok) sumEl.textContent += ' ⚠️ 가중치 합계가 99000~101000 범위를 벗어남!';
}

function collectSystem(){
  const cfg = {};
  document.querySelectorAll('[data-cfg]').forEach(inp => {
    cfg[inp.dataset.cfg] = parseFloat(inp.value);
  });
  cfg.GACHA_RATES = {};
  document.querySelectorAll('[data-rate]').forEach(inp => {
    cfg.GACHA_RATES[inp.dataset.rate] = parseInt(inp.value) || 0;
  });
  cfg.SYNTHESIS_RATES = {};
  document.querySelectorAll('[data-synthesis-rate]').forEach(inp => {
    cfg.SYNTHESIS_RATES[inp.dataset.synthesisRate] = parseInt(inp.value) || 0;
  });
  cfg.TYPE_EFFECTIVENESS = {normal:{},explosive:{},vibration:{}};
  document.querySelectorAll('[data-aff]').forEach(inp => {
    const [at, size] = inp.dataset.aff.split('-');
    cfg.TYPE_EFFECTIVENESS[at][size] = parseFloat(inp.value) || 0;
  });
  return cfg;
}

function renderTower(){
  const units = loadLS(LS_KEYS.tower, DEFAULT_UNITS);
  // 표시 순서 보장: 기본 → _yeon → _dok → _don
  function unitGroupOrder(u) {
    const id = u.id || '';
    if (id.endsWith('_yeon')) return 1;
    if (id.endsWith('_dok'))  return 2;
    if (id.endsWith('_don'))  return 3;
    return 0;
  }
  units.sort(function(a, b) { return unitGroupOrder(a) - unitGroupOrder(b); });
  const area = document.getElementById('towerArea');

  // SKILL_OPTIONS 드롭다운 제거 — skillId는 숫자 직접 입력으로 변경
  let html = '<div class="section"><div class="section-title">🗼 타워 능력치 (108개 유닛)</div>';
  html += '<div class="tbl-wrap"><table id="towerTable"><thead><tr>';
  html += '<th>ID</th><th>이름</th><th>등급</th><th>공격타입</th><th>공격력</th><th>치명타율(‱)</th><th>공속(ms)</th><th>사거리</th><th>스킬ID</th><th>등급점수</th><th>뽑기</th><th>DPS</th>';
  html += '</tr></thead><tbody>';

  units.forEach((u, i) => {
    const dps = (u.damage / (u.attackSpeed / 1000)).toFixed(1);
    const gs = u.gradeScore || 0;
    const ga = u.gachaAvailable !== undefined ? u.gachaAvailable : true;

    html += `<tr class="tier-${u.tier}" data-idx="${i}">
      <td><input type="text" readonly value="${u.id}" data-field="id"></td>
      <td><input type="text" value="${esc(u.name)}" data-field="name"></td>
      <td><select data-field="tier">${TIERS.map(t=>`<option value="${t}"${t===u.tier?' selected':''}>${TIER_LABELS[t]}</option>`).join('')}</select></td>
      <td><select data-field="attackType">${ATK_TYPES.map(t=>`<option value="${t}"${t===u.attackType?' selected':''}>${ATK_LABELS[t]}</option>`).join('')}</select></td>
      <td><input type="number" value="${u.damage}" data-field="damage"></td>
      <td><input type="number" value="${u.criticalRate !== undefined ? u.criticalRate : 1000}" data-field="criticalRate"></td>
      <td><input type="number" value="${u.attackSpeed}" data-field="attackSpeed"></td>
      <td><input type="number" value="${u.range}" data-field="range"></td>
      <td><input type="number" value="${u.skillId !== undefined ? u.skillId : ''}" data-field="skillId" style="width:55px"></td>
      <td><input type="number" value="${gs}" data-field="gradeScore" style="width:80px"></td>
      <td><input type="checkbox" data-field="gachaAvailable" ${ga?'checked':''} style="width:auto"></td>
      <td><span class="calc" id="dps-${i}">${dps}</span></td>
    </tr>`;
  });

  html += '</tbody></table></div></div>';
  area.innerHTML = html;

  // DPS recalc + tier color
  const table = document.getElementById('towerTable');
  table.addEventListener('input', e => {
    const tr = e.target.closest('tr');
    if(!tr) return;
    updateTowerRow(tr);
  });
  table.addEventListener('change', e => {
    const tr = e.target.closest('tr');
    if(!tr) return;
    if(e.target.dataset.field === 'tier'){
      tr.className = 'tier-' + e.target.value;
    }
    updateTowerRow(tr);
  });
}

function updateTowerRow(tr){
  const idx = tr.dataset.idx;
  const dmg = parseFloat(tr.querySelector('[data-field="damage"]').value) || 0;
  const spd = parseFloat(tr.querySelector('[data-field="attackSpeed"]').value) || 1;
  const dps = (dmg / (spd / 1000)).toFixed(1);
  document.getElementById('dps-'+idx).textContent = dps;
}

function collectTower(){
  const rows = document.querySelectorAll('#towerTable tbody tr');
  return Array.from(rows).map(tr => {
    const rawSkill = tr.querySelector('[data-field="skillId"]').value;
    const skillId = isNaN(rawSkill) ? rawSkill : parseInt(rawSkill);
    return {
      id: tr.querySelector('[data-field="id"]').value,
      name: tr.querySelector('[data-field="name"]').value,
      tier: tr.querySelector('[data-field="tier"]').value,
      attackType: tr.querySelector('[data-field="attackType"]').value,
      damage: parseFloat(tr.querySelector('[data-field="damage"]').value) || 0,
      criticalRate: parseInt(tr.querySelector('[data-field="criticalRate"]').value) || 1000,
      attackSpeed: parseFloat(tr.querySelector('[data-field="attackSpeed"]').value) || 0,
      range: parseFloat(tr.querySelector('[data-field="range"]').value) || 0,
      skillId: skillId,
      gradeScore: parseInt(tr.querySelector('[data-field="gradeScore"]').value) || 0,
      gachaAvailable: tr.querySelector('[data-field="gachaAvailable"]').checked
    };
  });
}

function collectSkill(){
  const result = {};
  document.querySelectorAll('#skillTable tbody tr').forEach(tr => {
    const sid = tr.dataset.sid;
    const filename = tr.querySelector('[data-field="imagePath"]').value.trim();
    const fullPath = filename ? (filename.startsWith('assets') ? filename : 'assets/Art/projectiles/' + filename) : '';
    const idVal = isNaN(sid) ? sid : parseInt(sid);
    const obj = {
      id: idVal,
      name: tr.querySelector('[data-field="name"]').value,
      nameEn: tr.querySelector('[data-field="nameEn"]').value,
      desc: tr.querySelector('[data-field="desc"]').value,
      projectileSpeed: parseFloat(tr.querySelector('[data-field="projectileSpeed"]').value) || 0,
      displaySize: parseInt(tr.querySelector('[data-field="displaySize"]').value) || 0,
      fallbackShape: tr.querySelector('[data-field="fallbackShape"]').value
    };
    if (fullPath) obj.imagePath = fullPath;
    // 체인 라이트닝 전용 필드
    const bc = tr.querySelector('[data-field="bounceCount"]').value;
    const br = tr.querySelector('[data-field="bounceRange"]').value;
    const bdm = tr.querySelector('[data-field="bounceDamageMultiplier"]').value;
    if (bc !== '') obj.bounceCount = parseInt(bc) || 0;
    if (br !== '') obj.bounceRange = parseInt(br) || 0;
    if (bdm !== '') obj.bounceDamageMultiplier = parseFloat(bdm) || 0;
    // 지속 피해(duration) 전용 필드
    const pd  = tr.querySelector('[data-field="poisonDuration"]').value;
    const mps = tr.querySelector('[data-field="maxPoisonStacks"]').value;
    const tr2 = tr.querySelector('[data-field="tickRate"]').value;
    const pdr = tr.querySelector('[data-field="poisonDamageRatio"]').value;
    if (pd  !== '') obj.poisonDuration    = parseInt(pd)    || 0;
    if (mps !== '') obj.maxPoisonStacks   = parseInt(mps)   || 0;
    if (tr2 !== '') obj.tickRate          = parseInt(tr2)   || 0;
    if (pdr !== '') obj.poisonDamageRatio = parseFloat(pdr) || 0;
    // 앵벌이(GOLD_FARM) 전용 필드
    const atr = tr.querySelector('[data-field="attacksToReward"]').value;
    const gr  = tr.querySelector('[data-field="goldReward"]').value;
    if (atr !== '') obj.attacksToReward = parseInt(atr) || 0;
    if (gr  !== '') obj.goldReward      = parseInt(gr)  || 0;
    const grd = tr.querySelector('[data-field="goldRewardDelta"]').value;
    if (grd !== '') obj.goldRewardDelta = parseFloat(grd) || 0;
    // fallbackColor 보존 (chain_lightning, poison 등)
    const orig = DEFAULT_SKILLS[sid];
    if (orig && orig.fallbackColor) obj.fallbackColor = orig.fallbackColor;
    // category 보존
    if (orig && orig.category) obj.category = orig.category;
    result[sid] = obj;
  });
  return result;
}

function updateSynthesisRateSum(){
  const rateInputs = Array.from(document.querySelectorAll('[data-synthesis-rate]'));
  const sum = rateInputs.reduce((total, inp) => total + (parseFloat(inp.value) || 0), 0);
  const displayTotal = sum || 100000;
  rateInputs.forEach(inp => {
    const v = parseFloat(inp.value) || 0;
    const pctEl = document.getElementById('synthesis-pct-' + inp.dataset.synthesisRate);
    if(pctEl) pctEl.textContent = (v / displayTotal * 100).toFixed(3) + '%';
  });
  const sumEl = document.getElementById('synthesisRateSum');
  const expectedTotal = 100000;
  const pct = (sum / expectedTotal * 100).toFixed(3);
  const ok = sum >= 99000 && sum <= 101000;
  sumEl.textContent = `합계: ${pct}% (${sum}/${expectedTotal})`;
  sumEl.className = 'sum-row ' + (ok ? 'ok' : 'err');
  if(!ok) sumEl.textContent += ' ⚠️ 가중치 합계가 100000 기준에서 너무 벗어났습니다!';
}

function updateMonsterTotals(tr){
  const hp = parseInt(tr.querySelector('[data-field="hp"]').value) || 0;
  const gold = parseInt(tr.querySelector('[data-field="goldReward"]').value) || 0;
  const countEl = tr.querySelector('[data-field="count"]');
  const count = Math.max(0, parseInt(countEl.value) || 0);
  countEl.value = count;
  tr.querySelector('[data-total-hp]').textContent = (hp * count).toLocaleString();
  tr.querySelector('[data-total-gold]').textContent = (gold * count).toLocaleString();
}

function collectMonster(){
  const rows = document.querySelectorAll('#monsterTable tbody tr');
  const monsterData = Array.from(rows).map(tr => ({
    id:         parseInt(tr.querySelector('[data-field="id"]').value) || 0,
    name:       tr.querySelector('[data-field="name"]').value,
    type:       tr.querySelector('[data-field="type"]').value,
    hp:         parseInt(tr.querySelector('[data-field="hp"]').value) || 0,
    speed:      parseFloat(tr.querySelector('[data-field="speed"]').value) || 0,
    goldReward: parseInt(tr.querySelector('[data-field="goldReward"]').value) || 0,
    isBoss:     tr.querySelector('[data-field="isBoss"]').checked,
    imagePath:  tr.querySelector('[data-field="imagePath"]').value.trim()
  }));

  const waves = loadLS(LS_KEYS.stage, DEFAULT_WAVES);
  rows.forEach(tr => {
    const monsterId = parseInt(tr.querySelector('[data-field="id"]').value) || 0;
    const countEl   = tr.querySelector('[data-field="count"]');
    if (!countEl) return;
    const newCount = parseInt(countEl.value) || 0;
    const wave = waves.find(w => w.monsterId === monsterId);
    if (wave) wave.count = newCount;
  });
  localStorage.setItem(LS_KEYS.stage, JSON.stringify(waves));
  return monsterData;
}

  const waves = loadLS(LS_KEYS.stage, DEFAULT_WAVES);
  const area = document.getElementById('stageArea');
  let html = '<div class="section"><div class="section-title">📋 스테이지 (52 라운드)</div>';
  html += '<div class="tbl-wrap"><table id="stageTable"><thead><tr>';
  html += '<th>라운드</th><th>몬스터 ID</th><th>⏱제한시간(초)</th><th>⚔️타임어택</th><th>🏆클리어골드</th><th>🕒리스폰시간(ms)</th>';
  html += '</tr></thead><tbody>';

  const monsters = loadLS(LS_KEYS.monster, DEFAULT_MONSTERS);
  waves.forEach((w, i) => {
    const m = monsters.find(x => x.id === w.monsterId) || monsters[0];
    const isBoss = m ? m.isBoss : false;
    const timeAttack = w.timeAttack === true;
    html += `<tr class="${isBoss?'boss-row':''}" data-idx="${i}">
      <td><input type="number" value="${w.round}" data-field="round" readonly style="width:50px"></td>
      <td><input type="number" value="${w.monsterId}" data-field="monsterId" style="width:70px"></td>
      <td><input type="number" value="${w.timeLimit||0}" data-field="timeLimit" style="width:70px" min="0"></td>
      <td><input type="checkbox" data-field="timeAttack" ${timeAttack?'checked':''} style="width:auto"></td>
      <td><input type="number" value="${w.clearGoldBonus||0}" data-field="clearGoldBonus" style="width:80px" min="0" title="스테이지 클리어 시 지급되는 보너스 골드"></td>
      <td><input type="number" value="${w.spawnInterval||2000}" data-field="spawnInterval" style="width:80px" min="100" step="100" title="이 라운드의 모스터 리스폰 간격(ms)"></td>
    </tr>`;
  });

  html += '</tbody></table></div></div>';
  area.innerHTML = html;

  // Real HP recalc
  const table = document.getElementById('stageTable');
  table.addEventListener('input', e => {
    const tr = e.target.closest('tr');
    if(!tr) return;
    updateStageRow(tr);
  });
  table.addEventListener('change', e => {
    const tr = e.target.closest('tr');
    if(!tr) return;
    const field = e.target.dataset.field;
    if(field === 'isBoss'){
      tr.classList.toggle('boss-row', e.target.checked);
    }
    updateStageRow(tr);
  });
}

function updateStageRow(tr){
  const idx = tr.dataset.idx;

}

function collectStage(){
  const rows  = document.querySelectorAll('#stageTable tbody tr');
  // 수량(count)은 몬스터 테이블에서 관리 → 현재 wave LS에서 읽어 유지
  const waves = loadLS(LS_KEYS.stage, DEFAULT_WAVES);
  return Array.from(rows).map(tr => {
    const round      = parseInt(tr.querySelector('[data-field="round"]').value) || 0;
    const monsterId  = parseInt(tr.querySelector('[data-field="monsterId"]').value) || 1;
    const existing   = waves.find(w => w.round === round);
    return {
      round,
      monsterId,
      count:         existing ? (existing.count || 0) : 0,  // 몬스터 테이블에서 관리
      timeLimit:      parseInt(tr.querySelector('[data-field="timeLimit"]').value) || 0,
      timeAttack:     tr.querySelector('[data-field="timeAttack"]').checked,
      clearGoldBonus: parseInt(tr.querySelector('[data-field="clearGoldBonus"]').value) || 0,
      spawnInterval:  parseInt(tr.querySelector('[data-field="spawnInterval"]').value) || 2000
    };
  });
}

// TAB 6: DPS MODE
// ═══════════════════════════════════════════════
function renderDps(){
  const cfg = loadLS(LS_KEYS.dps, DEFAULT_DPS_MODE);
  const area = document.getElementById('dpsArea');
  let html = '<h2 style="color:#00AAFF;margin-bottom:12px">📊 DPS MODE 설정</h2>';

  // 기본 설정 테이블
  html += '<div class="tbl-wrap"><table id="dpsTable"><thead><tr>';
  html += '<th>스폰 간격(ms)</th><th>몬스터 속도</th><th>몬스터 HP</th><th>골드 보상</th><th>시작 골드</th><th>뽑기</th>';
  html += '</tr></thead><tbody><tr>';
  html += `<td><input type="number" data-field="spawnInterval" value="${cfg.spawnInterval}" style="width:80px"></td>`;
  html += `<td><input type="number" data-field="monsterSpeed" value="${cfg.monsterSpeed}" step="0.1" style="width:80px"></td>`;
  html += `<td><input type="number" data-field="monsterHp" value="${cfg.monsterHp}" style="width:160px"></td>`;
  html += `<td><input type="number" data-field="goldReward" value="${cfg.goldReward}" style="width:80px"></td>`;
  html += `<td><input type="number" data-field="startGold" value="${cfg.startGold !== undefined ? cfg.startGold : 0}" style="width:80px"></td>`;
  html += `<td><input type="checkbox" data-field="gachaEnabled" ${cfg.gachaEnabled ? 'checked' : ''}> 활성화</td>`;
  html += '</tr></tbody></table></div>';

  // 타입별 수량 테이블
  html += '<h3 style="color:#88CCFF;margin:16px 0 8px">몬스터 타입별 스폰 수량</h3>';
  html += '<div class="tbl-wrap"><table id="dpsTypesTable"><thead><tr>';
  html += '<th>#</th><th>타입</th><th>수량</th><th>삭제</th>';
  html += '</tr></thead><tbody>';

  const types = cfg.types || DEFAULT_DPS_MODE.types;
  const typeOpts = ['general','small','large','boss_normal','boss_large','boss_small'];
  const typeLabels = {general:'일반',small:'소형',large:'대형',boss_normal:'보스_일반',boss_large:'보스_대형',boss_small:'보스_소형'};
  types.forEach((t, i) => {
    html += `<tr data-idx="${i}">`;
    html += `<td>${i+1}</td>`;
    html += `<td><select data-field="type">`;
    typeOpts.forEach(o => {
      html += `<option value="${o}" ${t.type===o?'selected':''}>${typeLabels[o]||o}</option>`;
    });
    html += `</select></td>`;
    html += `<td><input type="number" data-field="count" value="${t.count}" style="width:60px" min="1"></td>`;
    html += `<td><button onclick="this.closest('tr').remove()" style="background:#c0392b;color:#fff;border:none;padding:2px 8px;border-radius:4px;cursor:pointer">✕</button></td>`;
    html += '</tr>';
  });
  html += '</tbody></table></div>';

  // 총 수량 표시 + 추가 버튼
  const totalCount = types.reduce((s,t) => s + t.count, 0);
  html += `<div style="margin:8px 0;color:#aaa">총 스폰: <span style="color:#00AAFF;font-weight:bold">${totalCount}</span>마리</div>`;
  html += '<button onclick="addDpsType()" style="background:#00AAFF;color:#000;border:none;padding:6px 16px;border-radius:6px;cursor:pointer;font-weight:bold">+ 타입 추가</button>';

  area.innerHTML = html;
}

function addDpsType(){
  const tbody = document.querySelector('#dpsTypesTable tbody');
  const idx = tbody.rows.length;
  const typeOpts = ['general','small','large','boss_normal','boss_large','boss_small'];
  const typeLabels = {general:'일반',small:'소형',large:'대형',boss_normal:'보스_일반',boss_large:'보스_대형',boss_small:'보스_소형'};
  let html = `<tr data-idx="${idx}"><td>${idx+1}</td><td><select data-field="type">`;
  typeOpts.forEach(o => { html += `<option value="${o}">${typeLabels[o]||o}</option>`; });
  html += `</select></td>`;
  html += `<td><input type="number" data-field="count" value="10" style="width:60px" min="1"></td>`;
  html += `<td><button onclick="this.closest('tr').remove()" style="background:#c0392b;color:#fff;border:none;padding:2px 8px;border-radius:4px;cursor:pointer">✕</button></td></tr>`;
  tbody.insertAdjacentHTML('beforeend', html);
}

function collectDps(){
  const tbl = document.getElementById('dpsTable');
  const row = tbl.querySelector('tbody tr');
  const typesRows = document.querySelectorAll('#dpsTypesTable tbody tr');

  return {
    spawnInterval: parseInt(row.querySelector('[data-field="spawnInterval"]').value) || 1800,
    monsterSpeed:  parseFloat(row.querySelector('[data-field="monsterSpeed"]').value) || 0.9,
    monsterHp:     parseInt(row.querySelector('[data-field="monsterHp"]').value) || 9007199254740991,
    goldReward:    parseInt(row.querySelector('[data-field="goldReward"]').value) || 0,
    startGold:     parseInt(row.querySelector('[data-field="startGold"]').value) || 0,
    gachaEnabled:  row.querySelector('[data-field="gachaEnabled"]').checked,
    types: Array.from(typesRows).map(tr => ({
      type:  tr.querySelector('[data-field="type"]').value,
      count: parseInt(tr.querySelector('[data-field="count"]').value) || 10
    }))
  };
}

// ═══════════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════════
function getCollector(tab){
  switch(tab){
    case 'system': return { collect: collectSystem, key: LS_KEYS.system };
    case 'tower':  return { collect: collectTower,  key: LS_KEYS.tower };
    case 'skill':  return { collect: collectSkill,  key: LS_KEYS.skill };
    case 'monster': return { collect: collectMonster, key: LS_KEYS.monster };
    case 'stage':  return { collect: collectStage,  key: LS_KEYS.stage };
    case 'dps':    return { collect: collectDps,    key: LS_KEYS.dps };
  }
}

function getDefaults(tab){
  switch(tab){
    case 'system': return DEFAULT_CONFIG;
    case 'tower':  return DEFAULT_UNITS;
    case 'skill':  return DEFAULT_SKILLS;
    case 'monster': return DEFAULT_MONSTERS;
    case 'stage':  return DEFAULT_WAVES;
    case 'dps':    return DEFAULT_DPS_MODE;
  }
}

function getRenderer(tab){
  switch(tab){
    case 'system': return renderSystem;
    case 'tower':  return renderTower;
    case 'skill':  return renderSkill;
    case 'monster': return renderMonster;
    case 'stage':  return renderStage;
    case 'dps':    return renderDps;
  }
}

function saveCurrentTab(){
  try{
    const {collect, key} = getCollector(activeTab);
    const data = collect();
    localStorage.setItem(key, JSON.stringify(data));
    showStatus(`✅ [${LS_KEYS[activeTab]}] 저장 완료!`, true);
  }catch(e){
    showStatus('❌ 저장 실패: ' + e.message, false);
  }
}

function resetCurrentTab(){
  if(!confirm('현재 탭의 데이터를 기본값으로 되돌리시겠습니까?')) return;
  try{
    localStorage.removeItem(LS_KEYS[activeTab]);
    getRenderer(activeTab)();
    showStatus('↩ 기본값으로 복원됨', true);
  }catch(e){
    showStatus('❌ 복원 실패: ' + e.message, false);
  }
}

function resetAllTabs(){
  if(!confirm('⚠️ 모든 탭의 localStorage를 삭제하고 최신 DEFAULT 데이터로 새로 로드합니다.\n계속하시겠습니까?')) return;
  try{
    // 모든 탭 localStorage 삭제
    Object.values(LS_KEYS).forEach(k => localStorage.removeItem(k));
    // 현재 탭 다시 렌더링
    getRenderer(activeTab)();
    showStatus('🗑 전체 초기화 완료 — 최신 DEFAULT 데이터 로드됨', true);
    console.log('[resetAllTabs] 모든 localStorage 키 삭제 완료:', Object.values(LS_KEYS));
  }catch(e){
    showStatus('❌ 초기화 실패: ' + e.message, false);
  }
}

function copyJSON(){
  try{
    const {collect} = getCollector(activeTab);
    const json = JSON.stringify(collect(), null, 2);
    navigator.clipboard.writeText(json).then(()=>{
      showStatus('📋 JSON이 클립보드에 복사됨', true);
    }).catch(()=>{
      // Fallback
      const ta = document.createElement('textarea');
      ta.value = json; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy');
      document.body.removeChild(ta);
      showStatus('📋 JSON이 클립보드에 복사됨', true);
    });
  }catch(e){
    showStatus('❌ 복사 실패: ' + e.message, false);
  }
}

function pasteJSON(){
  const raw = prompt('JSON 데이터를 붙여넣으세요:');
  if(!raw) return;
  try{
    const data = JSON.parse(raw);
    localStorage.setItem(LS_KEYS[activeTab], JSON.stringify(data));
    getRenderer(activeTab)();
    showStatus('📥 JSON 데이터 적용 완료', true);
  }catch(e){
    showStatus('❌ JSON 파싱 실패: ' + e.message, false);
  }
}

async function applyToCode() {
  if (!window.showDirectoryPicker) {
    alert('이 브라우저는 파일 시스템 API를 지원하지 않습니다. 크롬/엣지를 사용해주세요.');
    return;
  }
  if (!confirm('경고: 실제 프로젝트 데이터 파일(stats.json 또는 config.js)을 덮어씁니다.\n\n진행하시겠습니까?\n\n(참고: 파일 선택기 창이 뜨면 프로젝트 루트 폴더인 "Project_RTD"를 선택해 주세요.)')) return;

  try {
    const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    
    if (activeTab === 'system') {
        let jsHandle;
        try { jsHandle = await dirHandle.getDirectoryHandle('js'); } catch(e) {
            alert('js 폴더를 찾지 못했습니다. 프로젝트 루트 폴더를 선택해주세요.');
            return;
        }
        let cfgHandle;
        try { cfgHandle = await jsHandle.getFileHandle('config.js'); }
        catch(e) {
            alert('config.js를 찾지 못했습니다. 프로젝트 루트 폴더를 선택해주세요.');
            return;
        }
        const file = await cfgHandle.getFile();
        let text = await file.text();
        
        const cfg = getCollector('system').collect();
        
        const keys = ['INITIAL_GOLD','GACHA_COST','ROUND_BONUS_MULTIPLIER','INITIAL_LIVES','MAX_MONSTERS','TOTAL_ROUNDS','SPAWN_INTERVAL','CRITICAL_DAMAGE_RATIO'];
        keys.forEach(k => {
            const regex = new RegExp(k + ':\\s*[\\d\\.]+,');
            text = text.replace(regex, k + ': ' + cfg[k] + ',');
        });
        
        let ratesStr = JSON.stringify(cfg.GACHA_RATES, null, 8).replace(/\n/g, '\n        ');
        text = text.replace(/GACHA_RATES:\s*\{[\s\S]*?\n\s*\}/, 'GACHA_RATES: ' + ratesStr.trim());

        let synthesisRatesStr = JSON.stringify(cfg.SYNTHESIS_RATES, null, 8).replace(/\n/g, '\n        ');
        text = text.replace(/SYNTHESIS_RATES:\s*\{[\s\S]*?\n\s*\}/, 'SYNTHESIS_RATES: ' + synthesisRatesStr.trim());
        
        let typeStr = JSON.stringify(cfg.TYPE_EFFECTIVENESS, null, 8).replace(/\n/g, '\n        ');
        text = text.replace(
            /TYPE_EFFECTIVENESS:\s*\{[\s\S]*?\n    \},\n    \/\/ 보스 방어/,
            'TYPE_EFFECTIVENESS: ' + typeStr.trim() + ',\n    // 보스 방어'
        );
        
        // 쓰기 직전 핸들 재획득 (Windows 캐시 충돌 방지)
        const freshCfgHandle = await jsHandle.getFileHandle('config.js');
        const writable = await freshCfgHandle.createWritable();
        await writable.write(text);
        await writable.close();
        showStatus('✅ config.js 파일에 영구 적용 완료!', true);
    } else {
        // assets/data/stats.json 처리
        let assetsHandle, dataDirHandle;
        try { 
            assetsHandle = await dirHandle.getDirectoryHandle('assets'); 
            dataDirHandle = await assetsHandle.getDirectoryHandle('data');
        } catch(e) {
            alert('assets/data 폴더를 찾지 못했습니다. 프로젝트 루트 폴더를 선택해주세요.');
            return;
        }
        
        let statsHandle, statsObj = {};
        try {
            statsHandle = await dataDirHandle.getFileHandle('stats.json');
            const file = await statsHandle.getFile();
            statsObj = JSON.parse(await file.text());
        } catch(e) {
            // stats.json이 없을 경우 생성
            statsHandle = await dataDirHandle.getFileHandle('stats.json', { create: true });
        }
        
        if (activeTab === 'monster') {
            const arr = getCollector('monster').collect();
            const obj = {};
            arr.forEach(m => obj[m.id] = m);
            statsObj.monsters = obj;
        } else if (activeTab === 'stage') {
            statsObj.waves = getCollector('stage').collect();
        } else if (activeTab === 'tower') {
            statsObj.units = getCollector('tower').collect();
        } else if (activeTab === 'skill') {
            statsObj.skills = getCollector('skill').collect();
        }
        
        // 쓰기 직전 핸들 재획득 (Windows 캐시 충돌 방지)
        const freshStatsHandle = await dataDirHandle.getFileHandle('stats.json', { create: true });
        const writable = await freshStatsHandle.createWritable();
        await writable.write(JSON.stringify(statsObj, null, 2));
        await writable.close();
        showStatus('✅ stats.json 파일에 영구 적용 완료!', true);
    }
  } catch(e) {
    if(e.name !== 'AbortError') {
       showStatus('❌ 파일 적용 오류: ' + e.message, false);
    }
  }
}

// ── 안전 렌더 래퍼: 한 탭이 실패해도 나머지 탭은 정상 렌더링 ──
function safeRender(fn, name) {
  try {
    fn();
  } catch(e) {
    console.error('[' + name + '] 렌더링 오류:', e);
    const areaId = name.toLowerCase() + 'Area';
    const el = document.getElementById(areaId);
    if (el) el.innerHTML = '<div style="color:#f66;padding:16px;font-size:13px">❌ [' + name + '] 데이터 로드 실패: ' + e.message + '<br>전체 초기화 버튼을 눌러 주세요.</div>';
  }
}
